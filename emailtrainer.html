<style>

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.wrap{max-width:760px;margin:0 auto;padding:18px 16px 90px}

.mark{background:linear-gradient(transparent 55%,var(--marker) 55%,var(--marker) 92%,transparent 92%)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.s{background:var(--chip);color:var(--ink)}.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--marker);outline-offset:1px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip)}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.lvl{display:flex;gap:6px}.lvl span{width:30px;height:8px;border-radius:4px;background:var(--line)}.lvl span.on{background:var(--accent)}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.task{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px;font:inherit;cursor:pointer}
.task b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:17px}.task small{color:var(--soft)}
.task .done{float:right;font-size:13px;color:var(--ok);font-weight:700}
.steps{display:flex;gap:4px;margin:10px 0 14px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--accent)}.steps i.ok{background:var(--ok)}
.de{color:var(--soft);font-size:15px;margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:14px;cursor:pointer}
.keys{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.keys .chip{border-radius:8px;min-width:38px;font-weight:700}
.example{display:none;background:var(--chip);border-radius:10px;padding:8px 12px;margin:8px 0;font-style:italic}.example.show{display:block}
.fb{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.f{border-radius:10px;padding:7px 10px;font-size:15px}
.f.bad{background:var(--bad-bg);color:var(--bad)}.f.warn{background:var(--warn-bg);color:var(--warn)}.f.ok{background:var(--ok-bg);color:var(--ok)}
.f b{font-weight:700}.f .q{font-style:italic;opacity:.9}
.wc{font-size:14px;color:var(--soft)}.wc.in{color:var(--ok);font-weight:700}
.preview{white-space:pre-wrap;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:16px}
.score{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:56px;font-weight:800;line-height:1}
.bars{display:grid;grid-template-columns:110px 1fr 54px;gap:6px 10px;align-items:center;font-size:15px}
.bars .b{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bars .b i{display:block;height:100%;background:var(--accent)}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.merk{background:var(--chip);border-radius:12px;padding:14px}
.note{font-size:14px;color:var(--soft)}
.ai .f{margin:0}.ai ul{margin:6px 0;padding-left:20px}
.hidden{display:none!important}
.check li{list-style:none;margin:3px 0}.check{padding:0;margin:6px 0}.check input{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.timer{font-weight:700;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(10,15,35,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mbox{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox p{margin:0 0 14px}
@media (max-width:480px){.bars{grid-template-columns:90px 1fr 46px}}

  const m3=low.match(/\b(he|she|it|my (?:mum|dad|sister|brother|friend|teacher))\s+(like|go|play|want|need|have|live|love|watch|work|know|think)\b/);

  if(/\ba\s+(?!uni|use|euro|one|u[sr])[aeiou]\w+/i.test(s))add('warn','Ausdruck','Vor einem Vokal steht meist <b>an</b>: <i>an apple, an amazing day</i>.',q);
  const w=low.split(/\s+/);if(w.length>30)add('warn','Satzbau','Sehr langer Satz – teile ihn in zwei Sätze.',q);
  const raw=s.split(/\s+/);raw.forEach((rw,ri)=>{const core=rw.replace(/^[^A-Za-zÄÖÜäöüß']+|[^A-Za-zÄÖÜäöüß']+$/g,'').replace(/[’]/g,"'");if(!core)return;if(/^[A-ZÄÖÜ]/.test(core)&&ri>0)return;const lw=core.toLowerCase();if(SPELL[lw.replace(/'/g,'')])return;const parts=lw.split("'");const main=parts[0];const sufOk=parts.slice(1).every(p=>['t','s','re','ve','ll','d','m',''].includes(p));if(/[äöüß]/.test(main)){add('bad','Rechtschreibung',`„${esc(core)}“ ist kein englisches Wort.`,q);return;}if(!/^[a-z]+$/.test(main)||main.length<2)return;if(!known(main)||!sufOk){if(parts.length>1&&known(main)&&!sufOk)return;const sg=suggest(main);add('warn','Rechtschreibung',`Unbekanntes Wort „<b>${esc(core)}</b>“ – Tippfehler?${sg.length?' Meintest du: <b>'+sg.join('</b>, <b>')+'</b>?':''}${ri===0&&/^[A-Z]/.test(core)?' (Falls es ein Name ist, passt es.)':''}`,q);}});
  w.forEach(x=>{const c=x.replace(/[^a-zäöü']/g,'');if(SPELL[c])add('warn','Rechtschreibung',`Schreibweise: <b>${SPELL[c]}</b> (nicht „${c}“).`,q);if(CAPS.includes(c)&&new RegExp('\\b'+c+'\\b').test(s))add('warn','Großschreibung',`<b>${c[0].toUpperCase()+c.slice(1)}</b> schreibt man groß.`,q);});
 });
 if(T.trim()&&!/[.!?"”]\s*$/.test(T.trim()))add('warn','Satzzeichen','Am Satzende fehlt ein Punkt, Ruf- oder Fragezeichen.');
 const low=T.toLowerCase();
 const lk=LINKERS.filter(l=>new RegExp('\\b'+l.replace(/ /g,'\\s+')+'\\b').test(low));
 if(lk.length)add('ok','Bindewörter','Gut verbunden: '+lk.map(x=>'<b>'+x+'</b>').join(', '));
 if(/\b(was|were)\s+\w+ing\b/.test(low))add('ok','Zeiten','Past progressive verwendet (<i>was/were …-ing</i>) – super für den Hintergrund einer Geschichte.');

 return out;}
function analyseAll(text){const low=text.toLowerCase();const linkers=LINKERS.filter(l=>new RegExp('\\b'+l.replace(/ /g,'\\s+')+'\\b').test(low));
 const good=GOOD.filter(g=>low.replace(/'/g,'’').includes(g));const over=OVER.filter(o=>(low.match(new RegExp('\\b'+o+'\\b','g'))||[]).length>=3);return {linkers,good,over};}

const KEY='email-trainer-v1';
let S={name:'',level:1,hist:[],cur:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=s=>document.querySelector(s);const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const app=$('#app');
function ask(msg,yes='OK',no='Abbrechen'){return new Promise(res=>{const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><p>${msg}</p><div class="row"><button class="btn" data-y>${yes}</button><button class="btn s" data-n>${no}</button></div></div>`;document.body.appendChild(d);const done=v=>{d.remove();res(v);};d.querySelector('[data-y]').onclick=()=>done(true);d.querySelector('[data-n]').onclick=()=>done(false);d.querySelector('[data-y]').focus();});}
function hash(s){let h=7;for(const c of s.toLowerCase().trim())h=(h*31+c.charCodeAt(0))%1679616;return h.toString(36).padStart(4,'0');}
function code(){const p={n:S.name,l:S.level,h:S.hist.map(x=>[x.t,x.s,x.d,x.c])};return 'EM-'+hash(S.name)+'-'+btoa(unescape(encodeURIComponent(JSON.stringify(p))));}
function restore(c,name){try{const [,hs,b]=c.trim().match(/^EM-(\w{4})-(.+)$/);if(hs!==hash(name))return 'Der Code gehört zu einem anderen Namen.';const p=JSON.parse(decodeURIComponent(escape(atob(b))));if(p.n.trim().toLowerCase()!==name.trim().toLowerCase())return 'Der Code gehört zu einem anderen Namen.';S={name:p.n,level:p.l,hist:p.h.map(x=>({t:x[0],s:x[1],d:x[2],c:x[3]})),cur:null};save();return '';}catch(e){return 'Der Code ist ungültig.';}}

const LEVELS={1:'Stufe 1 – mit Satzanfängen und Beispielsätzen',2:'Stufe 2 – nur mit Satzanfängen',3:'Stufe 3 – frei schreiben wie bei der Schularbeit'};
function header(){return `<div class="who"><div><span class="pill">${esc(S.name)}</span> <span class="note">${LEVELS[S.level]}</span></div><div class="lvl" aria-label="Stufe ${S.level} von 3">${[1,2,3].map(i=>`<span class="${i<=S.level?'on':''}"></span>`).join('')}</div></div>`;}
function merkbox(){return `<details class="card"><summary><b>Merkbox: So ist eine E-Mail aufgebaut</b></summary><div class="merk" style="margin-top:10px">
<p><b>1. Anrede</b> – <i>Hi Tom,</i> &nbsp; <b>2. Einleitung</b> – warum schreibst du? &nbsp; <b>3. Hauptteil</b> – jeder Punkt der Aufgabe, neuer Punkt = neuer Absatz &nbsp; <b>4. Schluss</b> – Frage, Einladung oder Empfehlung &nbsp; <b>5. Grußformel</b> – <i>Love, Pia</i></p>
<p><b>Satzbau:</b> Subjekt – Verb – Objekt – Ort – Zeit. <i>Yesterday <b>I went</b> to the cinema.</i> (nie „went I“)</p>
<p><b>Beispiel:</b></p><div class="preview">Hi Lena,
You won’t believe what happened to me last weekend! I was walking through Salzburg with my grandma when I saw a girl with exactly the same jacket as mine.

It turned out that she was Sophie, my friend from summer camp! She was visiting her aunt, who lives in the same street as my grandma. What a coincidence!

We had an ice cream together. Write soon!
Love,
Pia</div>
<p class="note" style="margin-top:8px"><b>Schreib die Merkbox mit dem Beispiel ins Heft ab.</b></p></div></details>`;}
function viewStart(){app.innerHTML=`<h1><span class="mark">E-Mail-Trainer</span></h1><p class="sub">Englisch-Writing Schritt für Schritt – mit Satzanfängen, Sofort-Kontrolle und Punkten. Von Runde zu Runde gibt es weniger Hilfe.</p>
<div class="card"><h3>Wie heißt du?</h3><p class="note">Achtung: Der Name kann danach nicht mehr geändert werden.</p><input type="text" id="nm" autocomplete="off" placeholder="Vor- und Nachname"><div class="row" style="margin-top:10px"><button class="btn" id="go">Los geht’s</button></div></div>
<div class="card"><h3>Schon auf einem anderen Gerät geübt?</h3><p class="note">Namen oben eintragen und den Speicher-Code einfügen.</p><input type="text" id="cd" placeholder="EM-…" autocomplete="off"><div class="row" style="margin-top:10px"><button class="btn s" id="rs">Fortschritt laden</button><span id="msg" class="note"></span></div></div>`;
 $('#go').onclick=async()=>{const n=$('#nm').value.trim();if(n.length<2){$('#nm').focus();return;}if(!await ask(`Ist „<b>${esc(n)}</b>“ richtig? Der Name kann danach nicht mehr geändert werden.`,'Ja, stimmt','Nein, ändern'))return;S.name=n;save();viewHome();};
 $('#rs').onclick=()=>{const n=$('#nm').value.trim();if(n.length<2){$('#msg').textContent='Bitte zuerst den Namen eintragen.';return;}const e=restore($('#cd').value,n);if(e)$('#msg').textContent=e;else viewHome();};}
function focusTips(){const agg={};S.hist.slice(-3).forEach(h=>Object.entries(h.c||{}).forEach(([k,v])=>agg[k]=(agg[k]||0)+v));const top=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,2);
 const TIP={'Satzbau':'Subjekt vor dem Verb: <i>Yesterday <b>I went</b> …</i>','Zeiten':'Erzählung im Past simple, nach <i>did/does</i> die Grundform.','Großschreibung':'<b>I</b>, Satzanfänge, Tage, Monate und Orte groß.','Rechtschreibung':'Klassiker prüfen: <i>before, because, really, too</i>.','Satzzeichen':'Jeder Satz endet mit . ! oder ?','Ausdruck':'Typische Deutsch-Fallen: <i>become ≠ bekommen, I am 12</i>.','Aufbau':'Anrede mit Komma, Grußformel mit Namen.'};
 return top.length?`<div class="card" style="border-color:var(--warn)"><h3>Dein Fokus für diese Runde</h3>${top.map(([k,v])=>`<div class="f warn" style="margin:6px 0"><b>${k}</b> (${v}× in den letzten Runden): ${TIP[k]||''}</div>`).join('')}</div>`:'';}
function chart(){if(S.hist.length<2)return '';const h=S.hist.slice(-12);const W=320,H=120,p=24;const xs=i=>p+i*(W-2*p)/Math.max(1,h.length-1),ys=v=>H-p-(v/100)*(H-2*p);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Punkte der letzten Runden"><line x1="${p}" y1="${ys(75)}" x2="${W-p}" y2="${ys(75)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${W-p}" y="${ys(75)-4}" font-size="10" text-anchor="end" fill="var(--soft)">75 = nächste Stufe</text><polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${h.map((x,i)=>xs(i)+','+ys(x.s)).join(' ')}"/>${h.map((x,i)=>`<circle cx="${xs(i)}" cy="${ys(x.s)}" r="4" fill="var(--accent)"/><text x="${xs(i)}" y="${ys(x.s)-8}" font-size="10" text-anchor="middle" fill="var(--ink)">${x.s}</text>`).join('')}</svg>`;}
function viewHome(){S.cur=null;save();const doneIds=new Set(S.hist.map(h=>h.t));const best=S.hist.length?Math.max(...S.hist.map(h=>h.s)):0;

 if($('#ex'))$('#ex').onclick=()=>$('#exb').classList.toggle('show');
 if($('#back'))$('#back').onclick=()=>{S.cur.step--;save();viewStep();};
 $('#quit').onclick=async()=>{if(await ask('Abbrechen? Diese E-Mail wird nicht gewertet.','Ja, abbrechen','Weiterschreiben'))viewHome();};
 $('#next').onclick=async()=>{upd();const f=checkText(ta.value,s);const bad=f.filter(x=>x.lvl==='bad').length;
  if(!ta.value.trim()){if(!await ask('Dieser Schritt ist noch leer. Fehlende Punkte kosten bei der Schularbeit Punkte!','Trotzdem weiter','Zurück zum Schreiben'))return;}
  else if(s.point&&wc(ta.value)<5){if(!await ask('Das ist sehr kurz. Schreib lieber 1–2 ganze Sätze.','Trotzdem weiter','Weiterschreiben'))return;}
  else if(bad){if(await ask(`Es gibt noch <b>${bad} roten Fehler</b>. Möchtest du zuerst ausbessern?`,'Ja, ausbessern','Trotzdem weiter'))return;}
  if(i===st.length-1)viewResult();else{S.cur.step++;save();viewStep();}};}
function assemble(t){const a=S.cur.a;const body=[a.intro,...t.points.map((p,i)=>a['p'+i])].map(x=>(x||'').trim()).filter(Boolean);
 return [(a.greet||'').trim(),body.join('\n\n'),(a.close||'').trim(),(a.sign||'').trim()].filter(Boolean).join('\n');}
function viewFree(){const t=TASKS.find(x=>x.id===S.cur.t);
 app.innerHTML=`${header()}<h2>${esc(t.title)}</h2><div class="card"><p><b>${esc(t.task)}</b></p><p class="note">Hake jeden Punkt ab, sobald er in deiner E-Mail vorkommt:</p>
 <ul class="check">${t.points.map((p,i)=>`<li><label><input type="checkbox" data-i="${i}">${esc(p.label)}</label></li>`).join('')}</ul>
 <div class="row note"><span>Zeit: <span class="timer" id="tmr">0:00</span> (Ziel: höchstens 20 Minuten)</span></div>
 <textarea id="ta" style="min-height:260px" placeholder="Hi …,"></textarea>${keys()}<div class="wc" id="wcs"></div>
 <div class="row" style="margin-top:8px"><button class="btn s" id="chk">Text jetzt prüfen</button><button class="btn" id="done">Fertig – Auswertung</button><button class="btn s sm" id="quit" style="margin-left:auto">Abbrechen</button></div>
 <div class="fb" id="fb"></div></div>${merkbox()}`;
 const ta=$('#ta');ta.value=S.cur.free||'';const [lo,hi]=t.words;
 const upd=()=>{S.cur.free=ta.value;save();const n=wc(ta.value);$('#wcs').textContent=`${n} Wörter (Ziel ${lo}–${hi})`;$('#wcs').classList.toggle('in',n>=lo&&n<=hi);};
 ta.oninput=upd;upd();
 app.querySelectorAll('[data-i]').forEach(c=>{c.checked=!!S.cur.ticks[c.dataset.i];c.onchange=()=>{S.cur.ticks[c.dataset.i]=c.checked;save();};});
 app.querySelectorAll('.keys .chip').forEach(b=>b.onclick=()=>insertAt(ta,b.dataset.k));
 const iv=setInterval(()=>{const el=$('#tmr');if(!el){clearInterval(iv);return;}const s=Math.floor((Date.now()-S.cur.start)/1000);el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},1000);
 $('#chk').onclick=()=>{const lines=ta.value.split('\n');const first=lines[0]||'';const restT=lines.slice(1).join('\n');$('#fb').innerHTML=fbHTML([...checkText(first,{isGreeting:true}),...checkText(restT),...checkText(lines.slice(-2).join(' '),{isSign:true})]);};
 $('#quit').onclick=async()=>{if(await ask('Abbrechen? Diese E-Mail wird nicht gewertet.','Ja, abbrechen','Weiterschreiben'))viewHome();};
 $('#done').onclick=()=>viewResult();}
function score(t,text){const lines=text.split('\n');let content,issues=[];
 if(S.cur.level===3){const ticked=t.points.filter((_,i)=>S.cur.ticks[i]).length;content=Math.round(30*(ticked/t.points.length)*(/^(hi|hello|dear)/i.test(text.trim())?1:.85));
  issues=[...checkText(lines[0]||'',{isGreeting:true}),...checkText(lines.slice(1).join('\n')),...checkText(lines.slice(-2).join(' '),{isSign:true})];}
 else{const a=S.cur.a;const st=stepsOf(t);const filled=st.filter(s=>s.point?wc(a[s.k]||'')>=5:(a[s.k]||'').trim()).length;content=Math.round(30*filled/st.length);
  st.forEach(s=>issues.push(...checkText(a[s.k]||'',s)));}
 const n=wc(text),[lo,hi]=t.words;const len=n>=lo&&n<=hi?10:(n>=lo*.85&&n<=hi*1.15?5:0);
 const bad=issues.filter(x=>x.lvl==='bad'),warn=issues.filter(x=>x.lvl==='warn');const lang=Math.max(0,30-6*bad.length-2*warn.length);
 const an=analyseAll(text);const link=[0,5,10,15][Math.min(3,an.linkers.length)];const voc=Math.max(0,[0,4,7,11,15][Math.min(4,an.good.length)]-3*an.over.length);
 const cats={};[...bad,...warn].forEach(x=>cats[x.cat]=(cats[x.cat]||0)+1);
 return {total:content+len+lang+link+voc,parts:[['Inhalt',content,30],['Länge',len,10],['Sprache',lang,30],['Bindewörter',link,15],['Wortschatz',voc,15]],n,issues,an,cats};}
function viewResult(){const t=TASKS.find(x=>x.id===S.cur.t);const text=S.cur.level===3?S.cur.free:assemble(t);const r=score(t,text);const lvlBefore=S.cur.level;
 S.hist.push({t:t.id,s:r.total,d:Math.floor(Date.now()/864e5),c:r.cats,l:lvlBefore});let lvlMsg='';
 if(r.total>=75&&S.level<3&&S.level===lvlBefore){S.level++;lvlMsg=`<div class="f ok">🎉 Super! Du steigst auf <b>Stufe ${S.level}</b> auf: ${LEVELS[S.level].split('– ')[1]}.</div>`;}
 else if(r.total<50&&lvlBefore>1)lvlMsg=`<div class="f warn">Tipp: Probier die nächste Aufgabe noch einmal auf <b>Stufe ${lvlBefore-1}</b> (oben auf der Startseite einstellbar).</div>`;
 const prev=S.hist.filter(h=>h.t!==undefined).slice(-2,-1)[0];const diff=prev?r.total-prev.s:null;S.cur.done=true;save();
 const stars='★'.repeat(Math.round(r.total/20))+'☆'.repeat(5-Math.round(r.total/20));
 const topCats=Object.entries(r.cats).sort((a,b)=>b[1]-a[1]).slice(0,3);
 app.innerHTML=`${header()}<h2>Auswertung: ${esc(t.title)}</h2>
 <div class="card"><div class="row" style="justify-content:space-between"><div><div class="score">${r.total}</div><div class="note">von 100 Punkten · ${stars}</div></div><div class="note" style="text-align:right">${r.n} Wörter (Ziel ${t.words[0]}–${t.words[1]})${diff!==null?`<br>${diff>=0?'▲ +':'▼ '}${diff} zur letzten E-Mail`:''}</div></div>
 <div class="bars" style="margin-top:14px">${r.parts.map(([n,v,m])=>`<span>${n}</span><span class="b"><i style="width:${v/m*100}%"></i></span><span>${v}/${m}</span>`).join('')}</div>${lvlMsg?`<div style="margin-top:12px">${lvlMsg}</div>`:''}</div>
 <div class="card"><h3>Deine E-Mail</h3><div class="preview">${esc(text)}</div></div>
 <div class="card"><h3>Was du verbessern kannst</h3>${fbHTML(r.issues.filter(x=>x.lvl!=='ok'))||'<div class="f ok">✓ Keine Fehler gefunden – sehr gut!</div>'}
 ${r.an.over.length?`<div class="f warn" style="margin-top:6px">! <b>Abwechslung:</b> ${r.an.over.map(o=>`<b>${o}</b>`).join(', ')} kommt oft vor. Probier: amazing, brilliant, exciting, awful, extremely, after that …</div>`:''}
 ${r.an.linkers.length<3?`<div class="f warn" style="margin-top:6px">! <b>Bindewörter:</b> Verwende mindestens 3 verschiedene (because, while, when, by the time, after that …).</div>`:''}
 <p class="note">Die Sofort-Kontrolle findet typische Fehler, aber nicht alle. Lies deinen Text immer noch einmal selbst durch.</p></div>
 <div class="card ai hidden" id="ai"><h3>Feedback von Claude</h3><p class="note">Claude liest deine ganze E-Mail und gibt dir Tipps wie eine Lehrerin.</p><button class="btn" id="aibtn">Feedback holen</button><div id="aiout" style="margin-top:10px"></div></div>
 <div class="card"><h3>Zusammenfassung</h3>${topCats.length?`<p>Achte nächstes Mal besonders auf: ${topCats.map(([k,v])=>`<b>${k}</b> (${v}×)`).join(', ')}.</p>`:'<p>Diese E-Mail war sprachlich sehr sauber!</p>'}
 <p>Schreib die <b>verbesserte E-Mail ins Heft</b> – mit allen Korrekturen.</p><div class="row"><button class="btn" id="again">Nächste Runde</button><button class="btn s" id="redo">Dieselbe Aufgabe noch einmal</button></div></div>`;
 $('#again').onclick=()=>viewHome();$('#redo').onclick=()=>startTask(t.id);
 setupAI(t,text);}
let sampleP=null;function getSample(){if(!sampleP)sampleP=(window.claude&&window.claude.use?window.claude.use('sample'):Promise.resolve(null)).catch(()=>null);return sampleP;}
async function setupAI(t,text){const sample=await getSample();if(!sample)return;const box=$('#ai');if(!box)return;box.classList.remove('hidden');
 $('#aibtn').onclick=async()=>{const b=$('#aibtn');b.disabled=true;b.textContent='Claude liest …';const out=$('#aiout');
  const prompt=`Du bist eine freundliche Englischlehrerin an einem österreichischen Gymnasium (3. Klasse, 12–13 Jahre, Niveau A2). Bewerte die E-Mail einer Schülerin / eines Schülers.
Aufgabe: ${t.task}
Inhaltspunkte: ${t.points.map((p,i)=>(i+1)+'. '+p.label).join(' | ')}
Wortzahl-Ziel: ${t.words[0]}–${t.words[1]}
E-Mail:
"""${text}"""
Antworte NUR mit JSON, ohne Markdown:
{"lob":"1–2 Sätze auf Deutsch, was gut ist","inhalt":[{"punkt":"kurzer Name des Punkts","ok":true,"hinweis":"kurz auf Deutsch"}],"fehler":[{"original":"falscher Ausschnitt","korrektur":"richtige Form","erklaerung":"kurz und kindgerecht auf Deutsch"}],"tipps":["höchstens 3 konkrete Tipps auf Deutsch, mit englischem Beispiel"],"verbessert":"die korrigierte E-Mail auf Englisch – Ideen und Stil der Schülerin behalten, nur Fehler verbessern und höchstens 2 Bindewörter ergänzen"}
Maximal 6 Fehler, die wichtigsten zuerst. Erfinde keine Fehler.`;
  try{const r=await sample.json(prompt);
   out.innerHTML=`<div class="f ok">✓ ${esc(r.lob||'')}</div>
   ${(r.inhalt||[]).length?`<h3 style="margin-top:10px">Inhaltspunkte</h3>${r.inhalt.map(p=>`<div class="f ${p.ok?'ok':'warn'}" style="margin:4px 0">${p.ok?'✓':'!'} <b>${esc(p.punkt)}</b>${p.hinweis?' – '+esc(p.hinweis):''}</div>`).join('')}`:''}
   ${(r.fehler||[]).length?`<h3 style="margin-top:10px">Fehler</h3>${r.fehler.map(f=>`<div class="f bad" style="margin:4px 0">✗ „${esc(f.original)}“ → <b>${esc(f.korrektur)}</b><br><span style="color:var(--ink)">${esc(f.erklaerung)}</span></div>`).join('')}`:''}
   ${(r.tipps||[]).length?`<h3 style="margin-top:10px">Tipps</h3><ul>${r.tipps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
   ${r.verbessert?`<h3 style="margin-top:10px">Verbesserte Version</h3><div class="preview">${esc(r.verbessert)}</div>`:''}`;b.textContent='Feedback erhalten ✓';}
  catch(e){b.disabled=false;b.textContent='Nochmal versuchen';out.innerHTML=`<div class="f warn">${e&&e.code==='rate_limited'?'Gerade zu viele Anfragen – bitte in einer Minute noch einmal.':e&&e.code==='not_granted'?'Claude-Feedback ist hier nicht erlaubt.':'Das Feedback hat nicht geklappt. Bitte später noch einmal versuchen.'}</div>`;if(e&&e.code==='not_granted')box.classList.add('hidden');}};}
/* Start */
if(!S.name)viewStart();else if(S.cur&&!S.cur.done)(S.cur.level===3?viewFree:viewStep)();else viewHome();
</script>
